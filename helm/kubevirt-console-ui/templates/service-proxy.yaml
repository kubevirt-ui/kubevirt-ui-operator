apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.proxy.serviceName }}
  namespace: {{ include "kubevirt-console-ui.namespace" . }}
  labels:
    {{- include "kubevirt-console-ui.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: kubevirt-apiserver-proxy
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ .Values.proxy.servingCertSecret }}
spec:
  type: ClusterIP
  selector:
    {{- include "kubevirt-console-ui.proxySelectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.proxy.name }}-port
      port: {{ .Values.proxy.port }}
      targetPort: {{ .Values.proxy.port }}
      protocol: TCP
