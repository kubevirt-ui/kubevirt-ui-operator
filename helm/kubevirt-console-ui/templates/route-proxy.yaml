{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.route.name }}
  namespace: {{ include "kubevirt-console-ui.namespace" . }}
  labels:
    {{- include "kubevirt-console-ui.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: kubevirt-apiserver-proxy
  annotations:
    haproxy.router.openshift.io/hsts_header: max-age=31536000;includeSubDomains;preload
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ .Values.proxy.serviceName }}
    weight: 100
  port:
    targetPort: {{ .Values.proxy.port }}
  tls:
    termination: reencrypt
  wildcardPolicy: None
{{- end }}
