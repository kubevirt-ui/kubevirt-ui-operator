apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.nginxConfigMapName }}
  namespace: {{ include "kubevirt-console-ui.namespace" . }}
  labels:
    {{- include "kubevirt-console-ui.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: kubevirt-console-plugin
data:
  nginx.conf: |
    error_log /dev/stdout info;
    events {}
    http {
      access_log         /dev/stdout;
      include            /etc/nginx/mime.types;
      default_type       application/octet-stream;
      keepalive_timeout  65;
      add_header X-Content-Type-Options nosniff;
      server {
        listen              {{ .Values.plugin.port }} ssl;
        listen              [::]:{{ .Values.plugin.port }} ssl;
        ssl_certificate     /var/serving-cert/tls.crt;
        ssl_certificate_key /var/serving-cert/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        root                /usr/share/nginx/html;

        location = /plugin-manifest.json {
          add_header Cache-Control 'no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0';
          add_header Pragma 'no-cache';
          add_header Expires '0';
        }
        location = /plugin-entry.js {
          add_header Cache-Control 'no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0';
          add_header Pragma 'no-cache';
          add_header Expires '0';
        }
      }
    }
