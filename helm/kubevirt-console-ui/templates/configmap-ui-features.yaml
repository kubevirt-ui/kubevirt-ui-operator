apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.featuresConfigMapName }}
  namespace: {{ include "kubevirt-console-ui.namespace" . }}
  labels:
    {{- include "kubevirt-console-ui.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: kubevirt-ui-config
data:
  automaticSubscriptionActivationKey: {{ .Values.config.features.automaticSubscriptionActivationKey | quote }}
  automaticSubscriptionOrganizationId: {{ .Values.config.features.automaticSubscriptionOrganizationId | quote }}
  disabledGuestSystemLogsAccess: {{ .Values.config.features.disabledGuestSystemLogsAccess | quote }}
  kubevirtApiserverProxy: {{ .Values.config.features.kubevirtApiserverProxy | quote }}
  loadBalancerEnabled: {{ .Values.config.features.loadBalancerEnabled | quote }}
  nodePortAddress: {{ .Values.config.features.nodePortAddress | quote }}
  nodePortEnabled: {{ .Values.config.features.nodePortEnabled | quote }}
  {{- with .Values.config.features.ipStackType }}
  ipStackType: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.features.hcoVersion }}
  hcoVersion: {{ . | quote }}
  {{- end }}
