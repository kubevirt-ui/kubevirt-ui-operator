name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint chart
        run: helm lint ./helm/kubevirt-console-ui
      - name: Template chart
        run: |
          helm template kubevirt-ui ./helm/kubevirt-console-ui \
            --namespace kubevirt-ui \
            --set plugin.image=quay.io/kubevirt-ui/kubevirt-plugin:test \
            --set proxy.image=quay.io/kubevirt-ui/kubevirt-apiserver-proxy:test \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Restore setup-go's toolchain dir so we skip re-downloading the Go SDK each run.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/go
          key: ${{ runner.os }}-go-toolchain-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-toolchain-
      - uses: actions/setup-go@v5
        with:
          # Match go.mod's `toolchain` line; go-version-file uses only the `go` directive (1.22.0).
          go-version: '1.22.5'
          # Module download + go build cache (keyed on go.sum).
          cache: true
      - name: Test
        run: make test
      - name: Lint
        run: make lint
      - name: Build operator
        run: go build -o /dev/null ./cmd/...
      - name: Verify generated manifests
        run: make verify-manifests
      - name: Verify generated code
        run: make verify-generate
